<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio — Unfinished Cool Stuff</title>

    <link rel="stylesheet" href="style.css">

    <style>
        /* =====================================================
           PORTFOLIO PAGE
           ===================================================== */

        .portfolio-page {
            padding: 0 4vw 80px;
        }

        .portfolio-intro {
            padding: 70px 0 50px;
            border-bottom: 1px solid #1234d8;
        }

        .portfolio-intro h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(4rem, 10vw, 10rem);
            line-height: 0.85;
            font-weight: 400;
            letter-spacing: -0.06em;
        }

        .portfolio-intro p {
            max-width: 650px;
            margin: 35px 0 0;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
        }

        /* =====================================================
           YEAR
           ===================================================== */

        .portfolio-year {
            margin-top: 55px;
        }

        .portfolio-year-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;

            padding-bottom: 12px;

            border-bottom: 1px solid #1234d8;

            font-family: monospace;
            font-size: 13px;
            text-transform: uppercase;
        }

        .portfolio-year-title strong {
            font-size: 22px;
            font-weight: 400;
        }

        /* =====================================================
           POST GRID
           ===================================================== */

        .post-grid {
            display: grid;

            grid-template-columns:
                repeat(4, minmax(0, 1fr));

            gap: 1px;

            background: #1234d8;

            border-left: 1px solid #1234d8;
            border-top: 1px solid #1234d8;

            margin-top: 1px;
        }

        .post-card {
            position: relative;

            background: #f4f0e6;

            min-width: 0;

            cursor: pointer;

            transition:
                background 0.2s ease;
        }

        .post-card:hover {
            background: #ffffff;
        }

        /* =====================================================
           MEDIA THUMBNAIL
           ===================================================== */

        .post-media {
            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border-right: 1px solid #1234d8;
            border-bottom: 1px solid #1234d8;
        }

        .post-media img,
        .post-media video {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;
        }

        .post-media video {
            pointer-events: none;
        }

        /* =====================================================
           HEIC PLACEHOLDER
           ===================================================== */

        .heic-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;

            box-sizing: border-box;

            text-align: center;

            font-family: monospace;
            font-size: 11px;
            line-height: 1.4;

            background: #e8e3d7;
        }

        /* =====================================================
           POST INFORMATION
           ===================================================== */

        .post-info {
            padding: 13px;

            border-right: 1px solid #1234d8;
            border-bottom: 1px solid #1234d8;
        }

        .post-number {
            font-family: monospace;
            font-size: 11px;
        }

        .post-title {
            margin-top: 7px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
            line-height: 1.05;
        }

        .post-date {
            margin-top: 9px;

            font-family: monospace;
            font-size: 10px;

            opacity: 0.65;
        }

        .post-count {
            margin-top: 7px;

            font-family: monospace;
            font-size: 10px;

            opacity: 0.65;
        }

        /* =====================================================
           VIDEO INDICATOR
           ===================================================== */

        .video-indicator {
            position: absolute;

            right: 10px;
            bottom: 10px;

            padding: 5px 7px;

            background: #f4f0e6;

            border: 1px solid #1234d8;

            font-family: monospace;
            font-size: 9px;
        }

        /* =====================================================
           LOADING / ERROR
           ===================================================== */

        .portfolio-status {
            padding: 60px 0;

            font-family: monospace;
            font-size: 13px;
        }

        .portfolio-error {
            padding: 30px;

            border: 1px solid #1234d8;

            font-family: monospace;
            font-size: 13px;
        }

        /* =====================================================
           MODAL
           ===================================================== */

        .portfolio-modal {
            position: fixed;

            inset: 0;

            z-index: 9999;

            display: none;

            background: rgba(244, 240, 230, 0.97);
        }

        .portfolio-modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            height: 100%;

            display: flex;
            flex-direction: column;
        }

        .modal-header {
            flex-shrink: 0;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 16px 20px;

            border-bottom: 1px solid #1234d8;

            font-family: monospace;
            font-size: 12px;
        }

        .modal-close {
            border: 0;
            background: transparent;

            font-family: monospace;
            font-size: 12px;

            cursor: pointer;

            padding: 5px;
        }

        .modal-body {
            flex: 1;

            min-height: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 30px;

            position: relative;
        }

        .modal-media {
            max-width: 80vw;
            max-height: 75vh;

            object-fit: contain;
        }

        .modal-caption {
            flex-shrink: 0;

            max-height: 25vh;
            overflow-y: auto;

            padding: 20px;

            border-top: 1px solid #1234d8;

            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;

            white-space: pre-wrap;
        }

        .modal-arrow {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 45px;
            height: 45px;

            border: 1px solid #1234d8;

            background: #f4f0e6;

            font-family: monospace;
            font-size: 18px;

            cursor: pointer;
        }

        .modal-prev {
            left: 20px;
        }

        .modal-next {
            right: 20px;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 1000px) {

            .post-grid {
                grid-template-columns:
                    repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 700px) {

            .portfolio-page {
                padding: 0 3vw 60px;
            }

            .portfolio-intro {
                padding: 50px 0 35px;
            }

            .portfolio-intro h1 {
                font-size: 17vw;
            }

            .post-grid {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .post-title {
                font-size: 15px;
            }

            .modal-body {
                padding: 15px;
            }

            .modal-media {
                max-width: 90vw;
                max-height: 70vh;
            }

            .modal-prev {
                left: 8px;
            }

            .modal-next {
                right: 8px;
            }
        }

        @media (max-width: 450px) {

            .post-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <a href="index.html" class="site-logo">
            UNFINISHED<br>
            COOL STUFF
        </a>

        <nav class="site-nav">
            <a href="index.html">ARCHIVE</a>
            <a href="portfolio.html">PORTFOLIO</a>
            <a href="index.html#about">ABOUT</a>
        </nav>

    </header>


    <!-- =====================================================
         PORTFOLIO
         ===================================================== -->

    <main class="portfolio-page">

        <section class="portfolio-intro">

            <h1>PORTFOLIO</h1>

            <p>
                A chronological record of things made,
                tested, drawn, photographed, rendered,
                abandoned and occasionally finished.
            </p>

        </section>


        <div
            id="portfolio-container"
            class="portfolio-status"
        >
            Loading portfolio...
        </div>

    </main>


    <!-- =====================================================
         MODAL
         ===================================================== -->

    <div
        id="portfolio-modal"
        class="portfolio-modal"
        aria-hidden="true"
    >

        <div class="modal-content">

            <div class="modal-header">

                <span id="modal-counter">
                    001 / 001
                </span>

                <button
                    id="modal-close"
                    class="modal-close"
                    type="button"
                >
                    CLOSE ×
                </button>

            </div>


            <div class="modal-body">

                <button
                    id="modal-prev"
                    class="modal-arrow modal-prev"
                    type="button"
                    aria-label="Previous image"
                >
                    ←
                </button>

                <div id="modal-media-container"></div>

                <button
                    id="modal-next"
                    class="modal-arrow modal-next"
                    type="button"
                    aria-label="Next image"
                >
                    →
                </button>

            </div>


            <div
                id="modal-caption"
                class="modal-caption"
            ></div>

        </div>

    </div>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        const DATA_URL = "portfolio-data.json";

        const container =
            document.getElementById(
                "portfolio-container"
            );

        const modal =
            document.getElementById(
                "portfolio-modal"
            );

        const modalMediaContainer =
            document.getElementById(
                "modal-media-container"
            );

        const modalCaption =
            document.getElementById(
                "modal-caption"
            );

        const modalCounter =
            document.getElementById(
                "modal-counter"
            );

        const modalClose =
            document.getElementById(
                "modal-close"
            );

        const modalPrev =
            document.getElementById(
                "modal-prev"
            );

        const modalNext =
            document.getElementById(
                "modal-next"
            );


        let posts = [];

        let currentPost = null;

        let currentMediaIndex = 0;


        // ====================================================
        // LOAD DATA
        // ====================================================

        async function loadPortfolio() {

            try {

                const response =
                    await fetch(DATA_URL);

                if (!response.ok) {
                    throw new Error(
                        "Could not load portfolio-data.json"
                    );
                }

                const data =
                    await response.json();

                posts = data.posts || [];

                if (!posts.length) {

                    throw new Error(
                        "No portfolio posts found."
                    );
                }

                renderPortfolio();

            } catch (error) {

                console.error(error);

                container.innerHTML = `
                    <div class="portfolio-error">
                        ERROR LOADING PORTFOLIO
                        <br><br>
                        ${error.message}
                    </div>
                `;
            }
        }


        // ====================================================
        // GROUP POSTS BY YEAR
        // ====================================================

        function groupByYear(posts) {

            const groups = {};

            posts.forEach(post => {

                let year = "UNKNOWN";

                if (post.date) {

                    year =
                        post.date.substring(0, 4);
                }

                if (!groups[year]) {
                    groups[year] = [];
                }

                groups[year].push(post);
            });

            return groups;
        }


        // ====================================================
        // CREATE MEDIA THUMBNAIL
        // ====================================================

        function createThumbnail(
            post
        ) {

            const media =
                post.media || [];

            const firstMedia =
                media[0];

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "post-media";


            if (!firstMedia) {

                wrapper.innerHTML =
                    `<div class="heic-placeholder">
                        NO MEDIA
                    </div>`;

                return wrapper;
            }


            const src =
                firstMedia.src;

            const extension =
                src
                    .split(".")
                    .pop()
                    .toLowerCase();


            // ------------------------------------------------
            // HEIC
            // ------------------------------------------------

            if (
                extension === "heic" ||
                extension === "heif"
            ) {

                wrapper.innerHTML =
                    `<div class="heic-placeholder">
                        HEIC IMAGE<br>
                        OPEN TO VIEW
                    </div>`;

                return wrapper;
            }


            // ------------------------------------------------
            // VIDEO
            // ------------------------------------------------

            if (
                firstMedia.type === "video"
            ) {

                const video =
                    document.createElement(
                        "video"
                    );

                video.src = src;

                video.muted = true;

                video.playsInline = true;

                video.preload = "metadata";

                wrapper.appendChild(
                    video
                );


                const indicator =
                    document.createElement(
                        "span"
                    );

                indicator.className =
                    "video-indicator";

                indicator.textContent =
                    "VIDEO";

                wrapper.appendChild(
                    indicator
                );

                return wrapper;
            }


            // ------------------------------------------------
            // IMAGE
            // ------------------------------------------------

            const img =
                document.createElement(
                    "img"
                );

            img.src = src;

            img.alt =
                post.title || "";

            img.loading = "lazy";

            wrapper.appendChild(
                img
            );

            return wrapper;
        }


        // ====================================================
        // CREATE POST CARD
        // ====================================================

        function createPostCard(
            post
        ) {

            const card =
                document.createElement(
                    "article"
                );

            card.className =
                "post-card";


            card.appendChild(
                createThumbnail(post)
            );


            const info =
                document.createElement(
                    "div"
                );

            info.className =
                "post-info";


            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "post-number";

            number.textContent =
                post.number;


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "post-title";

            title.textContent =
                post.title ||
                "Untitled";


            const date =
                document.createElement(
                    "div"
                );

            date.className =
                "post-date";

            date.textContent =
                post.date_display ||
                "";


            const count =
                document.createElement(
                    "div"
                );

            count.className =
                "post-count";

            const mediaCount =
                (post.media || []).length;

            if (mediaCount > 1) {

                count.textContent =
                    `${mediaCount} MEDIA`;
            }


            info.appendChild(
                number
            );

            info.appendChild(
                title
            );

            info.appendChild(
                date
            );

            info.appendChild(
                count
            );

            card.appendChild(
                info
            );


            card.addEventListener(
                "click",
                () => {

                    openModal(
                        post,
                        0
                    );
                }
            );


            return card;
        }


        // ====================================================
        // RENDER PORTFOLIO
        // ====================================================

        function renderPortfolio() {

            container.innerHTML = "";

            const groups =
                groupByYear(posts);

            const years =
                Object.keys(groups)
                    .sort(
                        (a, b) =>
                            Number(b) -
                            Number(a)
                    );


            years.forEach(year => {

                const section =
                    document.createElement(
                        "section"
                    );

                section.className =
                    "portfolio-year";


                const header =
                    document.createElement(
                        "div"
                    );

                header.className =
                    "portfolio-year-title";


                const yearLabel =
                    document.createElement(
                        "strong"
                    );

                yearLabel.textContent =
                    year;


                const count =
                    document.createElement(
                        "span"
                    );

                count.textContent =
                    `${groups[year].length} POSTS`;


                header.appendChild(
                    yearLabel
                );

                header.appendChild(
                    count
                );


                const grid =
                    document.createElement(
                        "div"
                    );

                grid.className =
                    "post-grid";


                groups[year].forEach(
                    post => {

                        grid.appendChild(
                            createPostCard(
                                post
                            )
                        );
                    }
                );


                section.appendChild(
                    header
                );

                section.appendChild(
                    grid
                );

                container.appendChild(
                    section
                );
            });
        }


        // ====================================================
        // OPEN MODAL
        // ====================================================

        function openModal(
            post,
            mediaIndex
        ) {

            currentPost = post;

            currentMediaIndex =
                mediaIndex;

            modal.classList.add(
                "active"
            );

            modal.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";

            renderModalMedia();
        }


        // ====================================================
        // CLOSE MODAL
        // ====================================================

        function closeModal() {

            modal.classList.remove(
                "active"
            );

            modal.setAttribute(
                "aria-hidden",
                "true"
            );

            document.body.style.overflow =
                "";

            modalMediaContainer.innerHTML =
                "";

            currentPost = null;
        }


        // ====================================================
        // RENDER MODAL MEDIA
        // ====================================================

        function renderModalMedia() {

            if (!currentPost) {
                return;
            }

            const media =
                currentPost.media || [];

            if (!media.length) {
                return;
            }


            const item =
                media[currentMediaIndex];


            modalMediaContainer.innerHTML =
                "";


            const src =
                item.src;

            const extension =
                src
                    .split(".")
                    .pop()
                    .toLowerCase();


            // ------------------------------------------------
            // HEIC
            // ------------------------------------------------

            if (
                extension === "heic" ||
                extension === "heif"
            ) {

                const placeholder =
                    document.createElement(
                        "div"
                    );

                placeholder.className =
                    "heic-placeholder";

                placeholder.style.width =
                    "500px";

                placeholder.style.height =
                    "400px";

                placeholder.textContent =
                    "HEIC IMAGE — BROWSER PREVIEW NOT SUPPORTED";

                modalMediaContainer.appendChild(
                    placeholder
                );

            }

            // ------------------------------------------------
            // VIDEO
            // ------------------------------------------------

            else if (
                item.type === "video"
            ) {

                const video =
                    document.createElement(
                        "video"
                    );

                video.className =
                    "modal-media";

                video.src =
                    src;

                video.controls =
                    true;

                video.autoplay =
                    true;

                video.playsInline =
                    true;

                modalMediaContainer.appendChild(
                    video
                );

            }

            // ------------------------------------------------
            // IMAGE
            // ------------------------------------------------

            else {

                const img =
                    document.createElement(
                        "img"
                    );

                img.className =
                    "modal-media";

                img.src =
                    src;

                img.alt =
                    currentPost.title || "";

                modalMediaContainer.appendChild(
                    img
                );
            }


            // ------------------------------------------------
            // COUNTER
            // ------------------------------------------------

            modalCounter.textContent =
                `${currentPost.number} — ${currentMediaIndex + 1} / ${media.length}`;


            // ------------------------------------------------
            // CAPTION
            // ------------------------------------------------

            let captionText =
                currentPost.caption || "";


            if (
                currentPost.date_display
            ) {

                captionText =
                    `${currentPost.date_display}\n\n${captionText}`;
            }


            modalCaption.textContent =
                captionText;


            // ------------------------------------------------
            // ARROWS
            // ------------------------------------------------

            modalPrev.style.display =
                media.length > 1
                    ? "block"
                    : "none";

            modalNext.style.display =
                media.length > 1
                    ? "block"
                    : "none";
        }


        // ====================================================
        // NEXT MEDIA
        // ====================================================

        function nextMedia() {

            if (!currentPost) {
                return;
            }

            const media =
                currentPost.media || [];

            if (media.length <= 1) {
                return;
            }

            currentMediaIndex =
                (
                    currentMediaIndex + 1
                ) % media.length;

            renderModalMedia();
        }


        // ====================================================
        // PREVIOUS MEDIA
        // ====================================================

        function previousMedia() {

            if (!currentPost) {
                return;
            }

            const media =
                currentPost.media || [];

            if (media.length <= 1) {
                return;
            }

            currentMediaIndex =
                (
                    currentMediaIndex - 1 +
                    media.length
                ) % media.length;

            renderModalMedia();
        }


        // ====================================================
        // EVENTS
        // ====================================================

        modalClose.addEventListener(
            "click",
            closeModal
        );

        modalNext.addEventListener(
            "click",
            nextMedia
        );

        modalPrev.addEventListener(
            "click",
            previousMedia
        );


        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal
                ) {

                    closeModal();
                }
            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    !modal.classList.contains(
                        "active"
                    )
                ) {

                    return;
                }


                if (
                    event.key === "Escape"
                ) {

                    closeModal();
                }


                if (
                    event.key === "ArrowRight"
                ) {

                    nextMedia();
                }


                if (
                    event.key === "ArrowLeft"
                ) {

                    previousMedia();
                }
            }
        );


        // ====================================================
        // START
        // ====================================================

        loadPortfolio();

    </script>

</body>
</html>

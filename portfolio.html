<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio — UNFINISHED COOL STUFF</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #f4f0e6;
            color: #1234d8;
            font-family: Georgia, "Times New Roman", serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           HEADER
        ========================= */

        .site-header {
            position: sticky;
            top: 0;
            z-index: 50;

            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 18px 28px;

            background: #f4f0e6;
            border-bottom: 1px solid #1234d8;
        }

        .site-title {
            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 18px;
            font-weight: normal;

            letter-spacing: -0.03em;
        }

        .site-nav {
            display: flex;
            gap: 28px;

            font-family:
                "Courier New",
                monospace;

            font-size: 12px;
            letter-spacing: 0.04em;
        }

        .site-nav a:hover {
            text-decoration: underline;
        }

        /* =========================
           INTRO
        ========================= */

        .portfolio-intro {
            padding: 80px 28px 55px;
            border-bottom: 1px solid #1234d8;
        }

        .portfolio-intro h1 {
            margin: 0;

            max-width: 1100px;

            font-size:
                clamp(
                    52px,
                    9vw,
                    150px
                );

            line-height: 0.86;
            font-weight: normal;

            letter-spacing: -0.065em;
        }

        .portfolio-intro-meta {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            margin-top: 55px;

            font-family:
                "Courier New",
                monospace;

            font-size: 12px;
            line-height: 1.5;
        }

        .portfolio-intro-meta p {
            margin: 0;
            max-width: 420px;
        }

        /* =========================
           FILTERS
        ========================= */

        .filter-section {
            padding: 20px 28px;

            border-bottom: 1px solid #1234d8;
        }

        .filter-label {
            margin-bottom: 12px;

            font-family:
                "Courier New",
                monospace;

            font-size: 11px;
            letter-spacing: 0.08em;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-button {
            padding: 8px 12px;

            border: 1px solid #1234d8;
            border-radius: 0;

            background: transparent;
            color: #1234d8;

            font-family:
                "Courier New",
                monospace;

            font-size: 11px;

            cursor: pointer;
        }

        .filter-button:hover,
        .filter-button.active {
            background: #1234d8;
            color: #f4f0e6;
        }

        /* =========================
           PORTFOLIO
        ========================= */

        #portfolio-container {
            padding: 28px;
        }

        .year-section {
            margin-bottom: 65px;
        }

        .year-title {
            margin: 0 0 20px;

            padding-bottom: 10px;

            border-bottom: 1px solid #1234d8;

            font-family:
                "Courier New",
                monospace;

            font-size: 13px;
            font-weight: normal;
            letter-spacing: 0.06em;
        }

        .post-grid {
            display: grid;

            grid-template-columns:
                repeat(
                    4,
                    minmax(0, 1fr)
                );

            gap: 24px;

            background: #f4f0e6;
        }

        /* =========================
           POST CARD
        ========================= */

        .post-card {
            min-width: 0;
            cursor: pointer;
        }

        .post-card.hidden {
            display: none;
        }

        .post-media {
            position: relative;

            width: 100%;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            border: 1px solid #1234d8;

            background: #e9e4d8;
        }

        .post-media img,
        .post-media video {
            display: block;

            width: 100%;
            height: 100%;

            object-fit: cover;

            transition:
                transform 0.35s ease;
        }

        .post-card:hover
        .post-media img,
        .post-card:hover
        .post-media video {
            transform: scale(1.025);
        }

        /* =========================
           POST INFORMATION
        ========================= */

        .post-info {
            padding-top: 9px;
        }

        .post-number {
            margin-bottom: 4px;

            font-family:
                "Courier New",
                monospace;

            font-size: 10px;
        }

        .post-title {
            margin: 0;

            font-size: 17px;
            line-height: 1.05;
            font-weight: normal;

            letter-spacing: -0.02em;
        }

        .post-date {
            margin-top: 7px;

            font-family:
                "Courier New",
                monospace;

            font-size: 10px;
            line-height: 1.3;
        }

        .post-categories {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;

            margin-top: 8px;
        }

        .post-category {
            padding: 3px 5px;

            border: 1px solid #1234d8;

            font-family:
                "Courier New",
                monospace;

            font-size: 8px;
            line-height: 1;
        }

        /* =========================
           HEIC PLACEHOLDER
        ========================= */

        .heic-placeholder {
            display: flex;

            justify-content: center;
            align-items: center;

            width: 100%;
            height: 100%;

            padding: 20px;

            text-align: center;

            font-family:
                "Courier New",
                monospace;

            font-size: 10px;
            line-height: 1.4;
        }

        /* =========================
           EMPTY MESSAGE
        ========================= */

        .empty-message {
            padding: 80px 20px;

            font-family:
                "Courier New",
                monospace;

            font-size: 12px;
        }

        /* =========================
           MODAL
        ========================= */

        .modal {
            position: fixed;

            inset: 0;

            z-index: 100;

            display: none;

            background:
                rgba(
                    18,
                    52,
                    216,
                    0.96
                );
        }

        .modal.open {
            display: flex;
        }

        .modal-inner {
            position: relative;

            display: flex;
            flex-direction: column;

            width: 100%;
            height: 100%;

            padding: 25px;
        }

        .modal-top {
            display: flex;

            justify-content: space-between;
            align-items: flex-start;

            color: #f4f0e6;
        }

        .modal-title {
            max-width: 70%;

            font-size:
                clamp(
                    25px,
                    4vw,
                    55px
                );

            line-height: 0.95;
            font-weight: normal;

            letter-spacing: -0.04em;
        }

        .modal-close {
            padding: 0;

            border: 0;

            background: transparent;
            color: #f4f0e6;

            font-family:
                "Courier New",
                monospace;

            font-size: 14px;

            cursor: pointer;
        }

        .modal-content {
            position: relative;

            display: flex;

            justify-content: center;
            align-items: center;

            flex: 1;

            min-height: 0;

            margin: 20px 0;
        }

        .modal-content img,
        .modal-content video {
            max-width: 90%;
            max-height: 78vh;

            object-fit: contain;
        }

        .modal-heic {
            padding: 40px;

            color: #f4f0e6;

            border: 1px solid #f4f0e6;

            font-family:
                "Courier New",
                monospace;

            font-size: 12px;

            text-align: center;
        }

        .modal-arrow {
            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 42px;
            height: 42px;

            border:
                1px solid #f4f0e6;

            background: transparent;
            color: #f4f0e6;

            font-family:
                "Courier New",
                monospace;

            font-size: 18px;

            cursor: pointer;
        }

        .modal-arrow:hover {
            background: #f4f0e6;
            color: #1234d8;
        }

        .modal-prev {
            left: 0;
        }

        .modal-next {
            right: 0;
        }

        .modal-bottom {
            display: flex;

            justify-content: space-between;
            align-items: flex-end;

            gap: 20px;

            color: #f4f0e6;

            font-family:
                "Courier New",
                monospace;

            font-size: 11px;
            line-height: 1.4;
        }

        .modal-caption {
            max-width: 650px;

            white-space: pre-line;
        }

        .modal-counter {
            white-space: nowrap;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1000px) {

            .post-grid {
                grid-template-columns:
                    repeat(
                        3,
                        minmax(0, 1fr)
                    );
            }

        }

        @media (max-width: 700px) {

            .site-header {
                padding: 15px 18px;
            }

            .site-nav {
                gap: 14px;
            }

            .portfolio-intro {
                padding:
                    55px
                    18px
                    40px;
            }

            .portfolio-intro-meta {
                display: block;

                margin-top: 35px;
            }

            .portfolio-intro-meta p + p {
                margin-top: 15px;
            }

            .filter-section {
                padding: 18px;
            }

            #portfolio-container {
                padding: 18px;
            }

            .post-grid {
                grid-template-columns:
                    repeat(
                        2,
                        minmax(0, 1fr)
                    );

                gap: 16px;
            }

            .post-title {
                font-size: 15px;
            }

            .modal-inner {
                padding: 18px;
            }

            .modal-arrow {
                width: 35px;
                height: 35px;
            }

            .modal-content img,
            .modal-content video {
                max-width: 82%;
            }

        }

        @media (max-width: 450px) {

            .site-title {
                font-size: 15px;
            }

            .site-nav {
                font-size: 10px;
                gap: 10px;
            }

            .portfolio-intro h1 {
                font-size: 55px;
            }

            .post-grid {
                gap: 12px;
            }

        }

    </style>
</head>

<body>

<header class="site-header">

    <a
        href="index.html"
        class="site-title"
    >
        UNFINISHED COOL STUFF
    </a>

    <nav class="site-nav">

        <a href="index.html">
            ARCHIVE
        </a>

        <a href="portfolio.html">
            PORTFOLIO
        </a>

        <a href="index.html#about">
            ABOUT
        </a>

    </nav>

</header>


<section class="portfolio-intro">

    <h1>
        PORTFOLIO
    </h1>

    <div class="portfolio-intro-meta">

        <p>
            A chronological archive of things I have made,
            explored, drawn, photographed, designed,
            rendered and experimented with.
        </p>

        <p>
            2020 — 2026<br>
            INSTAGRAM / @ARTIST_SBK
        </p>

    </div>

</section>


<section class="filter-section">

    <div class="filter-label">
        FILTER BY CATEGORY
    </div>

    <div
        class="filters"
        id="filters"
    >

        <button
            class="filter-button active"
            data-filter="ALL"
        >
            ALL
        </button>

    </div>

</section>


<main id="portfolio-container">

    <div class="empty-message">
        Loading portfolio...
    </div>

</main>


<!-- =========================
     MODAL
========================= -->

<div
    class="modal"
    id="portfolio-modal"
>

    <div class="modal-inner">

        <div class="modal-top">

            <div
                class="modal-title"
                id="modal-title"
            ></div>

            <button
                class="modal-close"
                id="modal-close"
            >
                CLOSE ×
            </button>

        </div>


        <div class="modal-content">

            <button
                class="modal-arrow modal-prev"
                id="modal-prev"
            >
                ←
            </button>

            <div id="modal-media"></div>

            <button
                class="modal-arrow modal-next"
                id="modal-next"
            >
                →
            </button>

        </div>


        <div class="modal-bottom">

            <div
                class="modal-caption"
                id="modal-caption"
            ></div>

            <div
                class="modal-counter"
                id="modal-counter"
            ></div>

        </div>

    </div>

</div>


<script>

    /* =========================
       SETTINGS
    ========================= */

    const DATA_URL =
        "portfolio-data.json";

    const GITHUB_BASE =
        "https://swayam0333777-stack.github.io/unfinished-business/";


    /* =========================
       GLOBAL DATA
    ========================= */

    let portfolioData = [];

    let filteredPosts = [];

    let currentPostIndex = 0;

    let currentMediaIndex = 0;


    /* =========================
       PATH NORMALIZATION
    ========================= */

    function normalizeMediaPath(
        mediaPath
    ) {

        if (!mediaPath) {
            return "";
        }

        let path =
            mediaPath
                .replace(/^\/+/, "")
                .replace(/\\/g, "/");


        /*
            SUPPORT OLD FORMAT:

            portfolio/001/001-image-1.jpg

            ->

            portfolio/001-image-1.jpg
        */

        let match =
            path.match(
                /^portfolio\/(\d+)\/\1-(.+)$/i
            );

        if (match) {

            path =
                `portfolio/${match[1]}-${match[2]}`;

        }


        /*
            ALSO SUPPORT:

            portfolio/001/image-1.jpg

            ->

            portfolio/001-image-1.jpg
        */

        else {

            match =
                path.match(
                    /^portfolio\/(\d+)\/(.+)$/i
                );

            if (match) {

                path =
                    `portfolio/${match[1]}-${match[2]}`;

            }

        }


        /*
            CURRENT FORMAT:

            portfolio/001-image-1.jpg

            Leave it alone.
        */

        if (
            !path.startsWith(
                "portfolio/"
            )
        ) {

            path =
                `portfolio/${path}`;

        }


        return GITHUB_BASE + path;

    }


    /* =========================
       HELPERS
    ========================= */

    function getYear(post) {

        if (post.date) {

            return new Date(
                post.date
            ).getFullYear();

        }

        return "UNKNOWN";

    }


    function isVideo(
        src,
        type
    ) {

        if (
            type === "video"
        ) {

            return true;

        }

        return /\.(mp4|mov|m4v|webm)$/i.test(
            src
        );

    }


    function isHeic(src) {

        return /\.(heic|heif)$/i.test(
            src
        );

    }


    /* =========================
       LOAD DATA
    ========================= */

    async function loadPortfolio() {

        const container =
            document.getElementById(
                "portfolio-container"
            );

        try {

            const response =
                await fetch(
                    DATA_URL
                );


            if (!response.ok) {

                throw new Error(
                    `HTTP ${response.status}`
                );

            }


            const data =
                await response.json();


            /*
                Support either:

                [
                    {...},
                    {...}
                ]

                OR:

                {
                    "posts": [...]
                }
            */

            if (
                Array.isArray(data)
            ) {

                portfolioData =
                    data;

            }

            else if (
                Array.isArray(
                    data.posts
                )
            ) {

                portfolioData =
                    data.posts;

            }

            else {

                throw new Error(
                    "Portfolio JSON does not contain posts."
                );

            }


            filteredPosts =
                [...portfolioData];


            buildFilters();

            renderPortfolio();

        }

        catch (error) {

            console.error(
                "Portfolio loading error:",
                error
            );

            container.innerHTML = `

                <div class="empty-message">

                    Unable to load portfolio.

                    <br><br>

                    ${error.message}

                </div>

            `;

        }

    }


    /* =========================
       BUILD FILTERS
    ========================= */

    function buildFilters() {

        const filterContainer =
            document.getElementById(
                "filters"
            );


        const categories =
            new Set();


        portfolioData.forEach(
            post => {

                if (
                    Array.isArray(
                        post.categories
                    )
                ) {

                    post.categories.forEach(
                        category => {

                            categories.add(
                                category
                            );

                        }
                    );

                }

            }
        );


        const sortedCategories =
            [...categories].sort();


        sortedCategories.forEach(
            category => {

                const button =
                    document.createElement(
                        "button"
                    );


                button.className =
                    "filter-button";


                button.dataset.filter =
                    category;


                button.textContent =
                    category;


                button.addEventListener(
                    "click",
                    () => {

                        applyFilter(
                            category
                        );

                    }
                );


                filterContainer.appendChild(
                    button
                );

            }
        );


        const allButton =
            filterContainer.querySelector(
                '[data-filter="ALL"]'
            );


        allButton.addEventListener(
            "click",
            () => {

                applyFilter(
                    "ALL"
                );

            }
        );

    }


    /* =========================
       APPLY FILTER
    ========================= */

    function applyFilter(
        category
    ) {

        document
            .querySelectorAll(
                ".filter-button"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.filter ===
                        category
                    );

                }
            );


        if (
            category === "ALL"
        ) {

            filteredPosts =
                [...portfolioData];

        }

        else {

            filteredPosts =
                portfolioData.filter(
                    post =>
                        Array.isArray(
                            post.categories
                        ) &&
                        post.categories.includes(
                            category
                        )
                );

        }


        renderPortfolio();

    }


    /* =========================
       CREATE MEDIA
    ========================= */

    function createMediaElement(
        item,
        post,
        isModal = false
    ) {

        const src =
            normalizeMediaPath(
                item.src
            );


        if (
            isHeic(
                item.src
            )
        ) {

            const placeholder =
                document.createElement(
                    "div"
                );


            placeholder.className =
                isModal
                    ? "modal-heic"
                    : "heic-placeholder";


            placeholder.textContent =
                "HEIC IMAGE — BROWSER PREVIEW NOT SUPPORTED";


            return placeholder;

        }


        if (
            isVideo(
                item.src,
                item.type
            )
        ) {

            const video =
                document.createElement(
                    "video"
                );


            video.src =
                src;


            video.playsInline =
                true;


            video.preload =
                "metadata";


            if (isModal) {

                video.controls =
                    true;

                video.autoplay =
                    true;

                video.className =
                    "modal-media";

            }

            else {

                video.muted =
                    true;

            }


            return video;

        }


        const img =
            document.createElement(
                "img"
            );


        img.src =
            src;


        img.alt =
            post.title || "";


        if (!isModal) {

            img.loading =
                "lazy";

        }

        else {

            img.className =
                "modal-media";

        }


        return img;

    }


    /* =========================
       CREATE POST CARD
    ========================= */

    function createPostCard(
        post
    ) {

        const card =
            document.createElement(
                "article"
            );


        card.className =
            "post-card";


        const media =
            post.media || [];


        const firstMedia =
            media[0];


        const mediaWrapper =
            document.createElement(
                "div"
            );


        mediaWrapper.className =
            "post-media";


        if (!firstMedia) {

            mediaWrapper.innerHTML =
                `<div class="heic-placeholder">
                    NO MEDIA
                </div>`;

        }

        else {

            const mediaElement =
                createMediaElement(
                    firstMedia,
                    post,
                    false
                );


            mediaWrapper.appendChild(
                mediaElement
            );

        }


        card.appendChild(
            mediaWrapper
        );


        const info =
            document.createElement(
                "div"
            );


        info.className =
            "post-info";


        const number =
            document.createElement(
                "div"
            );


        number.className =
            "post-number";


        number.textContent =
            post.number;


        info.appendChild(
            number
        );


        const title =
            document.createElement(
                "h2"
            );


        title.className =
            "post-title";


        title.textContent =
            post.title ||
            "Untitled";


        info.appendChild(
            title
        );


        const date =
            document.createElement(
                "div"
            );


        date.className =
            "post-date";


        date.textContent =
            post.date_display ||
            "";


        info.appendChild(
            date
        );


        /*
            CATEGORIES
        */

        if (
            Array.isArray(
                post.categories
            ) &&
            post.categories.length
        ) {

            const categoryContainer =
                document.createElement(
                    "div"
                );


            categoryContainer.className =
                "post-categories";


            post.categories.forEach(
                category => {

                    const tag =
                        document.createElement(
                            "span"
                        );


                    tag.className =
                        "post-category";


                    tag.textContent =
                        category;


                    categoryContainer.appendChild(
                        tag
                    );

                }
            );


            info.appendChild(
                categoryContainer
            );

        }


        card.appendChild(
            info
        );


        card.addEventListener(
            "click",
            () => {

                currentPostIndex =
                    filteredPosts.indexOf(
                        post
                    );

                openModal(
                    post,
                    0
                );

            }
        );


        return card;

    }


    /* =========================
       RENDER PORTFOLIO
    ========================= */

    function renderPortfolio() {

        const container =
            document.getElementById(
                "portfolio-container"
            );


        container.innerHTML =
            "";


        if (
            !filteredPosts.length
        ) {

            container.innerHTML = `

                <div class="empty-message">

                    NO POSTS FOUND
                    FOR THIS CATEGORY.

                </div>

            `;

            return;

        }


        const groups = {};


        filteredPosts.forEach(
            post => {

                const year =
                    getYear(
                        post
                    );


                if (
                    !groups[year]
                ) {

                    groups[year] =
                        [];

                }


                groups[year].push(
                    post
                );

            }
        );


        const years =
            Object.keys(
                groups
            ).sort(
                (a, b) =>
                    Number(b) -
                    Number(a)
            );


        years.forEach(
            year => {

                const section =
                    document.createElement(
                        "section"
                    );


                section.className =
                    "year-section";


                const heading =
                    document.createElement(
                        "h2"
                    );


                heading.className =
                    "year-title";


                heading.textContent =
                    `${year} — ${groups[year].length} POSTS`;


                section.appendChild(
                    heading
                );


                const grid =
                    document.createElement(
                        "div"
                    );


                grid.className =
                    "post-grid";


                groups[year].forEach(
                    post => {

                        grid.appendChild(
                            createPostCard(
                                post
                            )
                        );

                    }
                );


                section.appendChild(
                    grid
                );


                container.appendChild(
                    section
                );

            }
        );

    }


    /* =========================
       OPEN MODAL
    ========================= */

    function openModal(
        post,
        mediaIndex
    ) {

        currentMediaIndex =
            mediaIndex;


        const modal =
            document.getElementById(
                "portfolio-modal"
            );


        modal.classList.add(
            "open"
        );


        document.body.style.overflow =
            "hidden";


        renderModal();

    }


    /* =========================
       CLOSE MODAL
    ========================= */

    function closeModal() {

        const modal =
            document.getElementById(
                "portfolio-modal"
            );


        modal.classList.remove(
            "open"
        );


        document.body.style.overflow =
            "";

    }


    /* =========================
       RENDER MODAL
    ========================= */

    function renderModal() {

        if (
            currentPostIndex < 0 ||
            currentPostIndex >=
            filteredPosts.length
        ) {

            return;

        }


        const post =
            filteredPosts[
                currentPostIndex
            ];


        const media =
            post.media || [];


        if (!media.length) {

            return;

        }


        const modalTitle =
            document.getElementById(
                "modal-title"
            );


        const modalMedia =
            document.getElementById(
                "modal-media"
            );


        const modalCaption =
            document.getElementById(
                "modal-caption"
            );


        const modalCounter =
            document.getElementById(
                "modal-counter"
            );


        const modalPrev =
            document.getElementById(
                "modal-prev"
            );


        const modalNext =
            document.getElementById(
                "modal-next"
            );


        modalTitle.textContent =
            post.title ||
            "Untitled";


        modalMedia.innerHTML =
            "";


        const item =
            media[
                currentMediaIndex
            ];


        const element =
            createMediaElement(
                item,
                post,
                true
            );


        modalMedia.appendChild(
            element
        );


        let caption =
            post.caption ||
            "";


        if (
            post.date_display
        ) {

            caption =
                `${post.date_display}\n\n${caption}`;

        }


        modalCaption.textContent =
            caption;


        modalCounter.textContent =
            `${post.number} — ${
                currentMediaIndex + 1
            } / ${
                media.length
            }`;


        modalPrev.style.display =
            media.length > 1
                ? "block"
                : "none";


        modalNext.style.display =
            media.length > 1
                ? "block"
                : "none";

    }


    /* =========================
       NEXT MEDIA
    ========================= */

    function nextMedia() {

        const post =
            filteredPosts[
                currentPostIndex
            ];


        if (!post) {
            return;
        }


        const media =
            post.media || [];


        if (
            media.length <= 1
        ) {

            return;

        }


        currentMediaIndex =
            (
                currentMediaIndex + 1
            ) %
            media.length;


        renderModal();

    }


    /* =========================
       PREVIOUS MEDIA
    ========================= */

    function previousMedia() {

        const post =
            filteredPosts[
                currentPostIndex
            ];


        if (!post) {
            return;
        }


        const media =
            post.media || [];


        if (
            media.length <= 1
        ) {

            return;

        }


        currentMediaIndex =
            (
                currentMediaIndex -
                1 +
                media.length
            ) %
            media.length;


        renderModal();

    }


    /* =========================
       PREVIOUS / NEXT POST
       USING MODAL ARROWS WHEN
       MEDIA COUNT IS ONE
    ========================= */

    function nextPost() {

        if (
            !filteredPosts.length
        ) {

            return;

        }


        currentPostIndex =
            (
                currentPostIndex + 1
            ) %
            filteredPosts.length;


        currentMediaIndex =
            0;


        renderModal();

    }


    function previousPost() {

        if (
            !filteredPosts.length
        ) {

            return;

        }


        currentPostIndex =
            (
                currentPostIndex -
                1 +
                filteredPosts.length
            ) %
            filteredPosts.length;


        currentMediaIndex =
            0;


        renderModal();

    }


    /* =========================
       EVENTS
    ========================= */

    document
        .getElementById(
            "modal-close"
        )
        .addEventListener(
            "click",
            closeModal
        );


    document
        .getElementById(
            "modal-next"
        )
        .addEventListener(
            "click",
            () => {

                const post =
                    filteredPosts[
                        currentPostIndex
                    ];


                if (
                    post &&
                    post.media &&
                    post.media.length > 1
                ) {

                    nextMedia();

                }

                else {

                    nextPost();

                }

            }
        );


    document
        .getElementById(
            "modal-prev"
        )
        .addEventListener(
            "click",
            () => {

                const post =
                    filteredPosts[
                        currentPostIndex
                    ];


                if (
                    post &&
                    post.media &&
                    post.media.length > 1
                ) {

                    previousMedia();

                }

                else {

                    previousPost();

                }

            }
        );


    document
        .getElementById(
            "portfolio-modal"
        )
        .addEventListener(
            "click",
            event => {

                if (
                    event.target.id ===
                    "portfolio-modal"
                ) {

                    closeModal();

                }

            }
        );


    document.addEventListener(
        "keydown",
        event => {

            const modal =
                document.getElementById(
                    "portfolio-modal"
                );


            if (
                !modal.classList.contains(
                    "open"
                )
            ) {

                return;

            }


            if (
                event.key ===
                "Escape"
            ) {

                closeModal();

            }


            if (
                event.key ===
                "ArrowRight"
            ) {

                const post =
                    filteredPosts[
                        currentPostIndex
                    ];


                if (
                    post &&
                    post.media &&
                    post.media.length > 1
                ) {

                    nextMedia();

                }

                else {

                    nextPost();

                }

            }


            if (
                event.key ===
                "ArrowLeft"
            ) {

                const post =
                    filteredPosts[
                        currentPostIndex
                    ];


                if (
                    post &&
                    post.media &&
                    post.media.length > 1
                ) {

                    previousMedia();

                }

                else {

                    previousPost();

                }

            }

        }
    );


    /* =========================
       START
    ========================= */

    loadPortfolio();

</script>

</body>
</html>

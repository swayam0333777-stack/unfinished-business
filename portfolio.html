<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio — Swayam</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #111111;
            color: #eeeeea;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        button,
        a {
            font: inherit;
        }

        button {
            border: 0;
            background: none;
            color: inherit;
            cursor: pointer;
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =========================================================
           HEADER
        ========================================================= */

        .site-header {
            width: 100%;
            height: 78px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 38px;

            border-bottom: 1px solid #303030;

            position: sticky;
            top: 0;
            z-index: 100;

            background: rgba(17, 17, 17, 0.94);
            backdrop-filter: blur(12px);
        }

        .logo {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .header-link {
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #aaaaa5;
            transition: color 0.2s ease;
        }

        .header-link:hover {
            color: #ffffff;
        }


        /* =========================================================
           MAIN
        ========================================================= */

        main {
            width: 100%;
        }


        /* =========================================================
           INTRO
        ========================================================= */

        .intro {
            min-height: 330px;

            padding: 90px 38px 70px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;

            border-bottom: 1px solid #303030;
        }

        .intro-label {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #777772;

            margin-bottom: 24px;
        }

        .intro-title {
            font-size: clamp(58px, 10vw, 150px);
            line-height: 0.82;
            font-weight: 500;
            letter-spacing: -0.065em;

            max-width: 1100px;
        }

        .intro-description {
            max-width: 560px;

            margin-top: 42px;

            font-size: 14px;
            line-height: 1.7;
            color: #999994;
        }


        /* =========================================================
           CATEGORY NAVIGATION
        ========================================================= */

        .category-section {
            padding: 28px 38px;

            border-bottom: 1px solid #303030;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }

        .category-label {
            font-size: 10px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: #666661;
            white-space: nowrap;
        }

        .category-nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 8px;
        }

        .category-button {
            border: 1px solid #3b3b3b;
            padding: 9px 14px;

            font-size: 11px;
            letter-spacing: 0.07em;
            text-transform: uppercase;

            color: #aaaaa5;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease;
        }

        .category-button:hover,
        .category-button.active {
            background: #eeeeea;
            border-color: #eeeeea;
            color: #111111;
        }


        /* =========================================================
           CATEGORY LANDING
        ========================================================= */

        .category-view {
            display: block;
        }

        .category-view.hidden {
            display: none;
        }

        .category-heading {
            padding: 58px 38px 35px;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            border-bottom: 1px solid #303030;
        }

        .category-number {
            font-size: 11px;
            color: #666661;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .category-title {
            font-size: clamp(40px, 7vw, 95px);
            line-height: 0.9;
            letter-spacing: -0.055em;
            font-weight: 500;
        }

        .category-count {
            font-size: 11px;
            color: #777772;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }


        /* =========================================================
           CATEGORY CARDS
        ========================================================= */

        .category-grid {
            padding: 38px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 18px;
        }

        .category-card {
            position: relative;

            min-height: 390px;

            border: 1px solid #303030;

            overflow: hidden;

            background: #181818;

            cursor: pointer;

            transition:
                transform 0.35s ease,
                border-color 0.35s ease;
        }

        .category-card:hover {
            transform: translateY(-5px);
            border-color: #555555;
        }

        .category-card-image {
            width: 100%;
            height: 100%;

            position: absolute;
            inset: 0;

            object-fit: cover;

            opacity: 0.72;

            transition:
                transform 0.6s ease,
                opacity 0.4s ease;
        }

        .category-card:hover .category-card-image {
            transform: scale(1.045);
            opacity: 0.9;
        }

        .category-card-overlay {
            position: absolute;
            inset: 0;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            padding: 22px;

            background:
                linear-gradient(
                    to bottom,
                    rgba(0, 0, 0, 0.35),
                    rgba(0, 0, 0, 0.1) 40%,
                    rgba(0, 0, 0, 0.8)
                );
        }

        .category-card-number {
            font-size: 11px;
            letter-spacing: 0.1em;
            color: #d0d0ca;
        }

        .category-card-bottom {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 15px;
        }

        .category-card-title {
            font-size: clamp(28px, 4vw, 55px);
            line-height: 0.9;
            letter-spacing: -0.05em;
            font-weight: 500;
        }

        .category-card-arrow {
            width: 36px;
            height: 36px;

            border: 1px solid rgba(255,255,255,0.45);

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .category-card:hover .category-card-arrow {
            background: #eeeeea;
            color: #111111;
        }


        /* =========================================================
           GALLERY
        ========================================================= */

        .gallery-view {
            display: none;
        }

        .gallery-view.active {
            display: block;
        }

        .gallery-header {
            padding: 52px 38px 34px;

            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            border-bottom: 1px solid #303030;
        }

        .gallery-heading-left {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .back-button {
            align-self: flex-start;

            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;

            color: #777772;

            transition: color 0.2s ease;
        }

        .back-button:hover {
            color: #ffffff;
        }

        .gallery-title {
            font-size: clamp(48px, 8vw, 110px);
            line-height: 0.85;
            letter-spacing: -0.06em;
            font-weight: 500;
        }

        .gallery-info {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #777772;
        }


        /* =========================================================
           IMAGE GRID
        ========================================================= */

        .gallery-grid {
            padding: 38px;

            display: grid;
            grid-template-columns: repeat(4, 1fr);

            gap: 12px;
        }

        .media-item {
            position: relative;

            background: #1b1b1b;

            aspect-ratio: 1 / 1;

            overflow: hidden;

            cursor: pointer;

            border: 1px solid #252525;
        }

        .media-item img {
            width: 100%;
            height: 100%;

            display: block;

            object-fit: cover;

            transition:
                transform 0.5s ease,
                opacity 0.35s ease;
        }

        .media-item:hover img {
            transform: scale(1.035);
            opacity: 0.82;
        }

        .media-item.video-item {
            cursor: pointer;
        }

        .video-label {
            position: absolute;

            left: 12px;
            bottom: 12px;

            padding: 6px 8px;

            background: rgba(0,0,0,0.75);

            font-size: 9px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .empty-message {
            padding: 100px 38px;

            color: #666661;

            font-size: 13px;
            line-height: 1.6;
        }

        .loading {
            padding: 100px 38px;

            color: #666661;

            font-size: 11px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }


        /* =========================================================
           IMAGE MODAL
        ========================================================= */

        .modal {
            position: fixed;
            inset: 0;

            z-index: 500;

            display: none;

            background: rgba(8, 8, 8, 0.97);

            align-items: center;
            justify-content: center;

            padding: 60px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        .modal-image {
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 120px);

            width: auto;
            height: auto;

            object-fit: contain;
        }

        .modal-video {
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 120px);
        }

        .modal-close {
            position: fixed;

            top: 24px;
            right: 30px;

            width: 42px;
            height: 42px;

            border: 1px solid #444444;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            color: #bbbbbb;

            z-index: 510;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .modal-close:hover {
            background: #eeeeea;
            color: #111111;
        }

        .modal-prev,
        .modal-next {
            position: fixed;

            top: 50%;

            transform: translateY(-50%);

            width: 48px;
            height: 48px;

            border: 1px solid #444444;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;

            color: #bbbbbb;

            z-index: 510;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .modal-prev {
            left: 25px;
        }

        .modal-next {
            right: 25px;
        }

        .modal-prev:hover,
        .modal-next:hover {
            background: #eeeeea;
            color: #111111;
        }

        .modal-counter {
            position: fixed;

            left: 50%;
            bottom: 24px;

            transform: translateX(-50%);

            font-size: 10px;
            letter-spacing: 0.12em;
            text-transform: uppercase;

            color: #777772;

            z-index: 510;
        }


        /* =========================================================
           FOOTER
        ========================================================= */

        footer {
            margin-top: 80px;

            padding: 28px 38px;

            border-top: 1px solid #303030;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color: #666661;

            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }


        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 1000px) {

            .category-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .gallery-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }


        @media (max-width: 700px) {

            .site-header {
                height: 64px;
                padding: 0 18px;
            }

            .header-right {
                gap: 14px;
            }

            .intro {
                min-height: 300px;
                padding: 65px 18px 45px;
            }

            .intro-title {
                font-size: clamp(54px, 16vw, 100px);
            }

            .intro-description {
                margin-top: 30px;
            }

            .category-section {
                padding: 18px;
                align-items: flex-start;
                flex-direction: column;
            }

            .category-nav {
                justify-content: flex-start;
            }

            .category-heading,
            .gallery-header {
                padding: 40px 18px 25px;
            }

            .category-grid {
                padding: 18px;
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .category-card {
                min-height: 320px;
            }

            .gallery-grid {
                padding: 18px;
                grid-template-columns: repeat(2, 1fr);
                gap: 7px;
            }

            .modal {
                padding: 20px;
            }

            .modal-image,
            .modal-video {
                max-width: calc(100vw - 40px);
                max-height: calc(100vh - 100px);
            }

            .modal-prev,
            .modal-next {
                width: 38px;
                height: 38px;
            }

            .modal-prev {
                left: 10px;
            }

            .modal-next {
                right: 10px;
            }

            footer {
                padding: 24px 18px;
            }
        }


        @media (max-width: 450px) {

            .header-right .header-link:first-child {
                display: none;
            }

            .gallery-grid {
                grid-template-columns: 1fr 1fr;
            }

            .category-button {
                padding: 8px 10px;
                font-size: 9px;
            }
        }
    </style>
</head>

    <!-- =========================================================

    ========================================================== -->

    <script>

        /* =====================================================
           CONFIGURATION
        ====================================================== */

        const GITHUB_USER = "swayam0333777-stack";

        const GITHUB_REPO = "unfinished-business";

        const GITHUB_BRANCH = "main";

        const CATEGORIES = [
            {
                id: "3D",
                name: "3D",
                folder: "3D",
                number: "01"
            },
            {
                id: "DIGITAL_ART",
                name: "Digital Art",
                folder: "DIGITAL_ART",
                number: "02"
            },
            {
                id: "PAINTING",
                name: "Paintings",
                folder: "PAINTING",
                number: "03"
            },
            {
                id: "PHOTOGRAPHY",
                name: "Photography",
                folder: "PHOTOGRAPHY",
                number: "04"
            },
            {
                id: "SKETCH",
                name: "Sketch",
                folder: "SKETCH",
                number: "05"
            }
        ];

        const API_BASE =
            `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/portfolio`;


        /* =====================================================
           ELEMENTS
        ====================================================== */

        const categoryView =
            document.getElementById("category-view");

        const galleryView =
            document.getElementById("gallery-view");

        const categoryGrid =
            document.getElementById("category-grid");

        const galleryGrid =
            document.getElementById("gallery-grid");

        const galleryTitle =
            document.getElementById("gallery-title");

        const galleryInfo =
            document.getElementById("gallery-info");

        const galleryLoading =
            document.getElementById("gallery-loading");

        const backButton =
            document.getElementById("back-button");

        const categoryButtons =
            document.querySelectorAll(".category-button");


        /* =====================================================
           MODAL ELEMENTS
        ====================================================== */

        const modal =
            document.getElementById("modal");

        const modalImage =
            document.getElementById("modal-image");

        const modalVideo =
            document.getElementById("modal-video");

        const modalClose =
            document.getElementById("modal-close");

        const modalPrev =
            document.getElementById("modal-prev");

        const modalNext =
            document.getElementById("modal-next");

        const modalCounter =
            document.getElementById("modal-counter");


        /* =====================================================
           STATE
        ====================================================== */

        let currentCategory = null;

        let currentMedia = [];

        let currentMediaIndex = 0;

        const categoryFiles = {};


        /* =====================================================
           HELPERS
        ====================================================== */

        function isImage(file) {

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            return [
                "jpg",
                "jpeg",
                "png",
                "gif",
                "webp",
                "avif"
            ].includes(extension);
        }


        function isVideo(file) {

            const extension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();

            return [
                "mp4",
                "webm",
                "mov",
                "m4v"
            ].includes(extension);
        }


        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        /* =====================================================
           GET FILES FROM GITHUB
        ====================================================== */

        async function getCategoryFiles(category) {

            if (categoryFiles[category.id]) {
                return categoryFiles[category.id];
            }

            const url =
                `${API_BASE}/${encodeURIComponent(category.folder)}?ref=${GITHUB_BRANCH}`;

            try {

                const response =
                    await fetch(url);

                if (!response.ok) {
                    throw new Error(
                        `GitHub returned ${response.status}`
                    );
                }

                const files =
                    await response.json();

                const media =
                    files.filter(file =>
                        isImage(file) ||
                        isVideo(file)
                    );

                media.sort((a, b) =>
                    a.name.localeCompare(
                        b.name,
                        undefined,
                        {
                            numeric: true,
                            sensitivity: "base"
                        }
                    )
                );

                categoryFiles[category.id] = media;

                return media;

            } catch (error) {

                console.error(
                    `Could not load ${category.name}:`,
                    error
                );

                categoryFiles[category.id] = [];

                return [];
            }
        }


        /* =====================================================
           GET FIRST IMAGE FOR CATEGORY
        ====================================================== */

        async function getCategoryPreview(category) {

            const files =
                await getCategoryFiles(category);

            const image =
                files.find(file =>
                    isImage(file)
                );

            if (image) {
                return image.download_url;
            }

            return "";
        }


        /* =====================================================
           CREATE CATEGORY CARDS
        ====================================================== */

        async function buildCategoryCards() {

            categoryGrid.innerHTML = "";

            for (const category of CATEGORIES) {

                const card =
                    document.createElement("article");

                card.className =
                    "category-card";

                card.dataset.category =
                    category.id;

                card.innerHTML = `

                    <div class="category-card-overlay">

                        <div class="category-card-number">
                            ${category.number}
                        </div>

                        <div class="category-card-bottom">

                            <h3 class="category-card-title">
                                ${escapeHTML(category.name)}
                            </h3>

                            <div class="category-card-arrow">
                                →
                            </div>

                        </div>

                    </div>

                `;

                categoryGrid.appendChild(card);

                card.addEventListener(
                    "click",
                    () => openGallery(category)
                );

                const preview =
                    await getCategoryPreview(category);

                if (preview) {

                    const image =
                        document.createElement("img");

                    image.className =
                        "category-card-image";

                    image.src =
                        preview;

                    image.alt =
                        category.name;

                    image.loading =
                        "lazy";

                    card.prepend(image);
                }
            }
        }


        /* =====================================================
           OPEN CATEGORY GALLERY
        ====================================================== */

        async function openGallery(category) {

            currentCategory =
                category;

            categoryView.classList.add("hidden");

            galleryView.classList.add("active");

            galleryTitle.textContent =
                category.name;

            galleryLoading.style.display =
                "block";

            galleryGrid.innerHTML =
                "";

            galleryInfo.textContent =
                "Loading...";

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            const files =
                await getCategoryFiles(category);

            currentMedia =
                files;

            galleryLoading.style.display =
                "none";

            galleryInfo.textContent =
                `${files.length} ${files.length === 1 ? "work" : "works"}`;

            if (!files.length) {

                galleryGrid.innerHTML = `

                    <div class="empty-message">
                        No images found in this category.
                    </div>

                `;

                return;
            }

            renderGallery(files);
        }


        /* =====================================================
           RENDER GALLERY
        ====================================================== */

        function renderGallery(files) {

            galleryGrid.innerHTML =
                "";

            files.forEach(
                (file, index) => {

                    const item =
                        document.createElement("article");

                    item.className =
                        "media-item";

                    if (isVideo(file)) {

                        item.classList.add(
                            "video-item"
                        );

                        item.innerHTML = `

                            <video
                                src="${file.download_url}"
                                muted
                                preload="metadata"
                                style="
                                    width:100%;
                                    height:100%;
                                    object-fit:cover;
                                    pointer-events:none;
                                "
                            ></video>

                            <div class="video-label">
                                Video
                            </div>

                        `;

                    } else {

                        item.innerHTML = `

                            <img
                                src="${file.download_url}"
                                alt="${escapeHTML(file.name)}"
                                loading="lazy"
                            >

                        `;
                    }

                    item.addEventListener(
                        "click",
                        () => openModal(index)
                    );

                    galleryGrid.appendChild(item);
                }
            );
        }


        /* =====================================================
           BACK TO CATEGORIES
        ====================================================== */

        function showCategories() {

            galleryView.classList.remove(
                "active"
            );

            categoryView.classList.remove(
                "hidden"
            );

            currentCategory =
                null;

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }


        backButton.addEventListener(
            "click",
            showCategories
        );


        /* =====================================================
           CATEGORY BUTTONS
        ====================================================== */

        categoryButtons.forEach(button => {

            button.addEventListener(
                "click",
                async () => {

                    const categoryId =
                        button.dataset.category;

                    categoryButtons.forEach(
                        item =>
                            item.classList.remove(
                                "active"
                            )
                    );

                    button.classList.add(
                        "active"
                    );

                    if (categoryId === "all") {

                        showCategories();

                        return;
                    }

                    const category =
                        CATEGORIES.find(
                            item =>
                                item.id === categoryId
                        );

                    if (category) {

                        await openGallery(
                            category
                        );
                    }
                }
            );

        });


        /* =====================================================
           OPEN MODAL
        ====================================================== */

        function openModal(index) {

            if (!currentMedia.length) {
                return;
            }

            currentMediaIndex =
                index;

            updateModal();

            modal.classList.add(
                "active"
            );

            modal.setAttribute(
                "aria-hidden",
                "false"
            );

            document.body.style.overflow =
                "hidden";
        }


        /* =====================================================
           UPDATE MODAL
        ====================================================== */

        function updateModal() {

            const file =
                currentMedia[
                    currentMediaIndex
                ];

            if (!file) {
                return;
            }

            modalImage.style.display =
                "none";

            modalVideo.style.display =
                "none";

            modalVideo.pause();

            if (isVideo(file)) {

                modalVideo.src =
                    file.download_url;

                modalVideo.style.display =
                    "block";

            } else {

                modalImage.src =
                    file.download_url;

                modalImage.alt =
                    file.name;

                modalImage.style.display =
                    "block";
            }

            modalCounter.textContent =
                `${String(currentMediaIndex + 1).padStart(2, "0")} / ${String(currentMedia.length).padStart(2, "0")}`;
        }


        /* =====================================================
           CLOSE MODAL
        ====================================================== */

        function closeModal() {

            modal.classList.remove(
                "active"
            );

            modal.setAttribute(
                "aria-hidden",
                "true"
            );

            modalVideo.pause();

            modalVideo.src =
                "";

            document.body.style.overflow =
                "";
        }


        modalClose.addEventListener(
            "click",
            closeModal
        );


        /* =====================================================
           PREVIOUS
        ====================================================== */

        modalPrev.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                if (!currentMedia.length) {
                    return;
                }

                currentMediaIndex--;

                if (currentMediaIndex < 0) {
                    currentMediaIndex =
                        currentMedia.length - 1;
                }

                updateModal();
            }
        );


        /* =====================================================
           NEXT
        ====================================================== */

        modalNext.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                if (!currentMedia.length) {
                    return;
                }

                currentMediaIndex++;

                if (
                    currentMediaIndex >=
                    currentMedia.length
                ) {
                    currentMediaIndex = 0;
                }

                updateModal();
            }
        );


        /* =====================================================
           CLICK OUTSIDE IMAGE TO CLOSE
        ====================================================== */

        modal.addEventListener(
            "click",
            event => {

                if (
                    event.target === modal ||
                    event.target ===
                    document.querySelector(
                        ".modal-content"
                    )
                ) {

                    closeModal();
                }
            }
        );


        /* =====================================================
           KEYBOARD CONTROLS
        ====================================================== */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    !modal.classList.contains(
                        "active"
                    )
                ) {
                    return;
                }

                if (event.key === "Escape") {
                    closeModal();
                }

                if (event.key === "ArrowLeft") {

                    modalPrev.click();
                }

                if (event.key === "ArrowRight") {

                    modalNext.click();
                }
            }
        );


        /* =====================================================
           INITIALIZE
        ====================================================== */

        buildCategoryCards();

    </script>

</body>
</html>
